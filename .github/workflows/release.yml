name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          VERSION="${VERSION#v}" UNIVERSAL=1 ./scripts/make-app.sh

      - name: Zip
        run: ditto -c -k --keepParent dist/AerialWall.app dist/AerialWall.zip

      - name: Sign update and build appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SPARKLE_VERSION=2.9.4
          curl -fsSL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p /tmp/sparkle && tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle
          printf '%s' "$SPARKLE_PRIVATE_KEY" > /tmp/ed_key
          SIGNATURE=$(/tmp/sparkle/bin/sign_update -f /tmp/ed_key dist/AerialWall.zip)
          VERSION="${GITHUB_REF_NAME#v}"
          cat > dist/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>AerialWall</title>
              <item>
                <title>${VERSION}</title>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <enclosure
                  url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/AerialWall.zip"
                  ${SIGNATURE}
                  type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF
          rm /tmp/ed_key

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/AerialWall.zip dist/appcast.xml \
            --title "AerialWall $GITHUB_REF_NAME" --generate-notes
